<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: blob:; connect-src 'self' *; img-src * data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>无法连接服务</title>
</head>
<body>
<script>
  // config.root_url 连接失败时的本地提示页，点击可重试

  function showLoading() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('retryBtn').disabled = true;
  }

  function hideLoading() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('retryBtn').disabled = false;
  }

  // 通知主进程重新加载 root_url
  function handlerRetry() {
    showLoading();
    window.electron.retryRootUrl();
  }

  // 展示当前配置的服务地址
  window.electron.getLocalConfig().then(function (config) {
    if (config && config.root_url) {
      try {
        var hostname = new URL(config.root_url).hostname;
        document.getElementById('serverHost').textContent = hostname;
      } catch (e) {
        document.getElementById('serverHost').textContent = config.root_url;
      }
    }
  });
</script>
<div id="loading" class="loading-overlay">
  <div class="spinner"></div>
</div>
<div class="offline-card" id="offlineCard">
  <div class="offline-icon">!</div>
  <h1>无法连接服务</h1>
  <p class="offline-desc">网络离线或服务器不可达，请检查网络后重试</p>
  <p class="offline-host">服务地址：<span id="serverHost">-</span></p>
  <button type="button" id="retryBtn" onclick="handlerRetry()">重新连接</button>
</div>
<style type="text/css">
    body {
        font-family: 'Helvetica Neue', sans-serif;
        background: #f8f9fa;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .offline-card {
        background: white;
        padding: 2.5rem;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        width: 90%;
        max-width: 600px;
        text-align: center;
    }

    .offline-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
        border-radius: 50%;
        background: #fff4e6;
        color: #fd7e14;
        font-size: 2rem;
        font-weight: 700;
        line-height: 64px;
    }

    h1 {
        margin: 0 0 1rem;
        font-size: 1.5rem;
        color: #212529;
    }

    .offline-desc {
        margin: 0 0 1rem;
        color: #868e96;
        line-height: 1.6;
    }

    .offline-host {
        margin: 0 0 2rem;
        color: #495057;
        font-size: 0.875rem;
    }

    #serverHost {
        color: #339af0;
        font-weight: 600;
    }

    button {
        background: linear-gradient(135deg, #4dabf7, #339af0);
        color: white;
        padding: 14px 32px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: transform 0.2s;
    }

    button:hover:not(:disabled) {
        transform: translateY(-2px);
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.9);
        z-index: 9999;
        display: none;
    }

    .spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        margin: -20px -20px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
    }
</style>
</body>
</html>
