<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: blob:; connect-src 'self' *; img-src * data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>正在连接</title>
</head>
<body>
<!-- 首次启动时由主进程 loadFile 展示，did-finish-load 后再 loadURL root_url -->
<div class="loading-page">
  <div class="spinner"></div>
  <p class="loading-text">正在连接服务器...</p>
</div>
<style type="text/css">
    body {
        font-family: 'Helvetica Neue', sans-serif;
        background: #f8f9fa;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .loading-page {
        text-align: center;
    }

    .loading-text {
        margin: 1.5rem 0 0;
        color: #868e96;
        font-size: 1rem;
    }

    .spinner {
        display: inline-block;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
    }
</style>
</body>
</html>
